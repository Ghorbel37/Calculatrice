name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Compiles, runs the JUnit tests and packages the runnable jar
      - run: ./mvnw -B verify
      - run: java -jar target/calculatrice.jar
      - uses: actions/upload-artifact@v4
        with:
          name: calculatrice-jar
          path: target/calculatrice.jar
